# Identificador local do projeto Supabase (o vínculo real é feito com
# `supabase link --project-ref <ref-do-projeto>`)
project_id = "guru-clicksign-contracts"

# Webhook público: a autenticação é pelo api_token do Guru no corpo
[functions.guru-webhook]
verify_jwt = false

# Público: a página pós-pagamento consulta o status/key pelo id da transação
[functions.get-signature-key]
verify_jwt = false

# Público: registra o aceite do Termo de Ciência e Aceite (checkbox da página)
[functions.accept-terms]
verify_jwt = false
